name: Main Quickoffer workflow

on:
  push:
    branches:
      - master
      - main

jobs:

  test_backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: qo_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        cd backend
        pip install -r requirements.txt
    - name: Run tests
      env:
        POSTGRES_DB: qo_test
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: testpass
        DB_HOST: localhost
        DB_PORT: 5432
        SECRET_KEY: test-secret-key-for-ci
        DEBUG_MODE: False
      run: |
        cd backend
        python manage.py test offer.tests --verbosity=2

  deploy:
    runs-on: ubuntu-latest
    needs: [test_backend]
    steps:
    - name: Executing remote ssh commands to deploy
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USER }}
        key: ${{ secrets.SSH_KEY }}
        passphrase: ${{ secrets.SSH_PASSPHRASE }}
        script: |
          cd /var/www/quickoffer
          git pull https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/${{ github.repository }}.git
          cd /var/www/quickoffer/frontend
          export NVM_DIR=~/.nvm
          source ~/.nvm/nvm.sh
          npm i
          npm run build
          cd ..
          cd backend/
          source venv/bin/activate
          pip install -r requirements.txt
          python manage.py migrate
          deactivate
          systemctl restart gunicorn.service

  send_message:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
    - name: Send message
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_TO }}
        token: ${{ secrets.TELEGRAM_TOKEN }}
        message: |
            ${{ github.actor }} Создал коммит: ${{ github.event.commits[0].message }}
            
            Репозиторий: ${{ github.repository }}
            
            Посмотреть изменения: https://github.com/${{ github.repository }}/commit/${{github.sha}}